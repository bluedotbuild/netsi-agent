# Publishes server.json to the official MCP Registry as io.github.bluedotsoft/netsi.
# GitHub Actions OIDC proves the repository belongs to bluedotsoft, so no personal login is involved.
# Runs when server.json changes on main (the version must be new) or by hand.
name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
